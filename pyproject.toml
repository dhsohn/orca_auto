[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orca_auto"
version = "0.2.0"
description = "orca_auto monorepo for ORCA, xTB, CREST, and workflow automation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Daehyup Sohn" },
]
keywords = [
    "orca",
    "dft",
    "computational-chemistry",
    "workflow-automation",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "discord.py>=2.4,<3.0",
    "PyYAML>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/dhsohn/orca_auto"
Repository = "https://github.com/dhsohn/orca_auto"
Issues = "https://github.com/dhsohn/orca_auto/issues"

[project.optional-dependencies]
dev = [
    "import-linter>=2.12",
    "mypy>=1.19.1",
    "pytest>=9.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
orca_auto = "orca_auto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["orca_auto*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Layout (including line length) is owned by `ruff format`, which
# `scripts/check.sh` enforces via `ruff format --check`. `E501` is intentionally
# omitted so the formatter stays the single source of truth for line wrapping.
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "UP"]
# UP042 (str-Enum -> StrEnum) changes `str()`/format semantics of status enums
# that are serialized and compared as plain strings; keep the str mixin.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
files = ["src/orca_auto", "tests"]
mypy_path = "src"
pretty = true
show_error_codes = true
warn_unused_configs = true
explicit_package_bases = true

# Strict-style mypy options are intentionally staged here for modules that have
# already been hardened. Keep the top-level mypy config broadly non-strict until
# the full src+tests tree passes the equivalent strict flags.
[[tool.mypy.overrides]]
module = [
    "orca_auto.core.app_ids",
    "orca_auto.core.activity_icons",
    "orca_auto.core.admission.persistence",
    "orca_auto.core.admission.records",
    "orca_auto.core.artifacts",
    "orca_auto.core.config.files",
    "orca_auto.core.config.schema",
    "orca_auto.core.engines.artifacts",
    "orca_auto.core.indexing.engine_records",
    "orca_auto.core.indexing.engines",
    "orca_auto.core.indexing.location",
    "orca_auto.core.indexing.text",
    "orca_auto.core.notifications.engine_requests",
    "orca_auto.core.notifications.engine_validation",
    "orca_auto.core.notifications.telegram_config",
    "orca_auto.core.notifications.telegram_format",
    "orca_auto.core.paths",
    "orca_auto.core.paths.*",
    "orca_auto.core.queue.cancellable",
    "orca_auto.core.queue.metadata",
    "orca_auto.core.queue.persistence",
    "orca_auto.core.queue.processes",
    "orca_auto.core.queue.resource_requests",
    "orca_auto.core.queue.types",
    "orca_auto.core.queue.worker.models",
    "orca_auto.core.queue.worker.signals",
    "orca_auto.core.statuses",
    "orca_auto.core.utils.coercion",
    "orca_auto.core.utils.lock",
    "orca_auto.core.utils.persistence",
    "orca_auto.core.utils.process",
]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true

# Layering is enforced by import-linter (`lint-imports`, run by scripts/check.sh
# and therefore by CI). Engine wiring crosses layers only through lazy string
# module paths (core/engine_catalog.py); that
# is the deliberate plugin seam and is invisible to the import graph on purpose.
[tool.importlinter]
root_packages = ["orca_auto"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Layered architecture: flow -> orca -> core"
type = "layers"
layers = [
    "orca_auto.flow",
    "orca_auto.orca",
    "orca_auto.core",
]

[[tool.importlinter.contracts]]
name = "Layered architecture: standalone xtb_md -> core"
type = "layers"
layers = [
    "orca_auto.xtb_md",
    "orca_auto.core",
]

[[tool.importlinter.contracts]]
name = "Standalone xtb_md is independent from ORCA"
type = "independence"
modules = [
    "orca_auto.xtb_md",
    "orca_auto.orca",
]

[[tool.importlinter.contracts]]
name = "Standalone xtb_md is independent from workflow orchestration"
type = "independence"
modules = [
    "orca_auto.xtb_md",
    "orca_auto.flow",
]

[tool.coverage.run]
source = ["src/orca_auto"]

[tool.coverage.report]
fail_under = 80
show_missing = true
