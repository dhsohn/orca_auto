[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orca_auto"
version = "4.0.0"
description = "orca_auto monorepo for ORCA, xTB, CREST, and workflow automation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Daehyup Sohn" },
]
keywords = [
    "orca",
    "dft",
    "computational-chemistry",
    "workflow-automation",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "PyYAML>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/dhsohn/orca_auto"
Repository = "https://github.com/dhsohn/orca_auto"
Issues = "https://github.com/dhsohn/orca_auto/issues"

[project.optional-dependencies]
dev = [
    "import-linter>=2.12",
    "mypy>=1.19.1",
    "pytest>=9.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
orca_auto = "orca_auto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["orca_auto*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Layout (including line length) is owned by `ruff format`, which
# `scripts/check.sh` enforces via `ruff format --check`. `E501` is intentionally
# omitted so the formatter stays the single source of truth for line wrapping.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "BLE",
    "FURB162",
    "FURB188",
    "PYI034",
    "UP",
    "RUF100",
]
# UP042 (str-Enum -> StrEnum) changes `str()`/format semantics of status enums
# that are serialized and compared as plain strings; keep the str mixin.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
files = ["src/orca_auto", "tests"]
mypy_path = "src"
pretty = true
show_error_codes = true
warn_unused_configs = true
explicit_package_bases = true

# Strict-style mypy options are intentionally staged here for modules that have
# already been hardened. Keep the top-level mypy config broadly non-strict until
# the full src+tests tree passes the equivalent strict flags.
[[tool.mypy.overrides]]
module = [
    "orca_auto.cli_systemd_freshness",
    "orca_auto.cli_systemd_restart",
    "orca_auto.cli_systemd_status",
    "orca_auto.cli_systemd_units",
    "orca_auto.cli_worker_supervision",
    "orca_auto.cli_workers",
    "orca_auto.core.activity_icons",
