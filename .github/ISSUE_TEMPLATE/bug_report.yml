name: Bug report
description: Report a reproducible orca_auto defect that is not specific to one chemistry failure.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove tokens, private paths, and proprietary calculation data before posting logs.
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What workflow were you trying to complete, and why does this matter?
      placeholder: I was trying to submit/cancel/inspect/organize ...
    validations:
      required: true
  - type: textarea
    id: changes-observed
    attributes:
      label: What happened
      description: Include the exact command, output, traceback, or unexpected state.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should orca_auto have done instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide a minimal sequence that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Run `orca_auto ...`
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/WSL, Python version, orca_auto version/commit, and relevant ORCA/xTB/CREST versions.
      placeholder: |
        OS: Ubuntu on WSL2
        Python: 3.13
        orca_auto commit:
        ORCA/xTB/CREST:
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Relevant sanitized artifacts
      description: Paste or attach sanitized snippets from queue entries, config, state, reports, or logs.
      placeholder: job_state.json, job_report.json, queue entry, command output, traceback
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed Telegram tokens, chat IDs, credentials, private paths, and proprietary calculation data.
          required: true
        - label: I checked existing issues and did not find a duplicate.
          required: true
