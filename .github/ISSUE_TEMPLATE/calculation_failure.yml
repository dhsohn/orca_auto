name: Calculation failure / retry triage
description: Report an ORCA or workflow calculation that failed, retried incorrectly, or needs classification.
title: "calc: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when the primary question is how orca_auto classified, retried, resumed, or reported a calculation. Remove secrets and private research data before posting.
  - type: dropdown
    id: calculation-type
    attributes:
      label: Calculation or workflow type
      options:
        - ORCA Opt/Freq/single job
        - ORCA ScanTS
        - ORCA OptTS
        - ORCA IRC
        - ORCA NEB-TS
        - reaction workflow
        - conformer workflow
        - internal xTB stage
        - internal CREST stage
        - not sure
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What were you trying to compute or recover?
      placeholder: The job should have ...
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed status and error markers
      description: Include status/reason fields and the most specific ORCA/output marker available.
      placeholder: |
        queue status:
        job_state.json status/reason:
        job_report.json analyzer status/reason:
        ORCA marker or output tail:
      render: text
    validations:
      required: true
  - type: textarea
    id: retry
    attributes:
      label: Retry/resume behavior
      description: What retry happened or did not happen? Include attempt numbers and generated retry input names when available.
      placeholder: |
        attempt 1:
        attempt 2:
        retry input:
        restart artifact used:
  - type: textarea
    id: artifacts
    attributes:
      label: Sanitized artifacts
      description: Attach or paste sanitized snippets from job_state.json, job_report.json, selected .inp, .out tail, and relevant .xyz/.gbw metadata.
      render: text
  - type: textarea
    id: expected
    attributes:
      label: Expected safe next action
      description: If you know it, state the safe next action. Otherwise say what is unclear.
      placeholder: Fail closed, reverse ScanTS from endpoint, complete endpoint scan first, no retry, etc.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, private paths, and proprietary/private structures that cannot be public.
          required: true
        - label: I did not request a generic non-ScanTS restart for a ScanTS-specific failure without evidence of a safe restart source.
          required: false
