name: orca_auto CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh examples/fake_orca_smoke/run.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_BIN: python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Run checks
        run: bash scripts/check.sh

      - name: Package smoke
        run: |
          python -m pip wheel . --no-deps -w /tmp/orca_auto-wheel-smoke
          python scripts/check_wheel_contents.py /tmp/orca_auto-wheel-smoke/orca_auto-*.whl

      - name: Check out machine observation contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dhsohn/machine-contracts
          ref: bc252035d01edddf1314e6641689c6d5cb88af92
          path: .machine-contracts
          persist-credentials: false

      - name: Verify emitted machine.json files against the common contract
        env:
          FACTORY_MACHINE_CONTRACT_VALIDATOR: ${{ github.workspace }}/.machine-contracts/scripts/validate.py
        run: |
          .venv/bin/python -m pip install -r .machine-contracts/requirements.txt
          .venv/bin/python -m pytest -q \
            tests/test_workflow_machine.py::test_completed_workflow_publishes_one_ready_machine_observation \
            tests/test_workflow_report.py::test_relaxed_scan_without_html_is_preserved_in_workflow_lineage \
            tests/test_state.py::TestState::test_write_report_files_json_fields
